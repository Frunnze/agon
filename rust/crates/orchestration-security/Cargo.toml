[package]
name = "orchestration-security"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", features = ["serde"] }
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
hex = "0.4.3"
orchestration-core = { version = "0.1.0", path = "../orchestration-core" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
proptest = "1.12.0"
uuid = "1.29.0"
