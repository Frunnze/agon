[package]
name = "orchestration-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
keepawake = "0.6.1"
orchestration-core = { version = "0.1.0", path = "../orchestration-core" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
