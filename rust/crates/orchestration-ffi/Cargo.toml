[package]
name = "orchestration-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"

[features]
default = ["runner", "app-server"]
runner = ["orchestration-node/runner"]
app-server = ["orchestration-node/app-server"]

[dependencies]
orchestration-node = { version = "0.1.0", path = "../orchestration-node", default-features = false }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
