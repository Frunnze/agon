[package]
name = "orchestration-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
orchestration-api = { version = "0.1.0", path = "../orchestration-api" }
orchestration-core = { version = "0.1.0", path = "../orchestration-core" }
orchestration-security = { version = "0.1.0", path = "../orchestration-security" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
orchestration-hub = { version = "0.1.0", path = "../orchestration-hub" }
proptest = "1.12.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
