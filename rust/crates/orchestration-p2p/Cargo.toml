[package]
name = "orchestration-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
iroh = "1.4.1"
iroh-dns = "1.4.1"
orchestration-core = { version = "0.1.0", path = "../orchestration-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
orchestration-security = { version = "0.1.0", path = "../orchestration-security" }
proptest = "1.12.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
